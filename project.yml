name: MLXCreate
options:
  bundleIdPrefix: com.fearless
  deploymentTarget:
    macOS: "26.2"
packages:
  MLXCreate:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.2"
    MLXC_CATALOG_URL: ""
targets:
  MLXCreate:
    type: application
    platform: macOS
    sources:
      - App
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - package: MLXCreate
        product: MCApp
      - package: MLXCreate
        product: MCGeneration
      - package: MLXCreate
        product: MCEngine
      - package: MLXCreate
        product: MCCatalog
      - package: MLXCreate
        product: MCLibrary
    scheme:
      testTargets:
        - MLXCreateUITests
    settings:
      base:
        PRODUCT_NAME: mlx-create
        PRODUCT_BUNDLE_IDENTIFIER: com.fearless.mlx-create
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: ""
    postCompileScripts:
      - name: Embed mlx-serve engine
        script: |
          "${SRCROOT}/scripts/embed-engine.sh"
        inputFiles:
          - $(SRCROOT)/scripts/embed-engine.sh
          - $(SRCROOT)/engine.lock
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/mlx-serve
    preBuildScripts:
      - name: Verify catalog release gate
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            cd "${SRCROOT}" && swift run mc-catalog verify --release --catalog-url "${MLXC_CATALOG_URL}" Sources/MCCatalog/Resources/catalog.json
          fi
        inputFiles:
          - $(SRCROOT)/Sources/MCCatalog/Resources/catalog.json
          - $(SRCROOT)/Sources/MCCatalog/Resources/catalog.json.sig
          - $(SRCROOT)/Sources/MCCatalog/Catalog/PinnedKeys.swift
  MLXCreateUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests/MLXCreateUITests
    dependencies:
      - target: MLXCreate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fearless.mlx-create.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
