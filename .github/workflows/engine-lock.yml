name: Engine lock

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: runner self-test
        run: python3 scripts/engine-contract/run_contract.py --self-test
      - name: contract suite record
        run: sh scripts/engine-contract/check_lock.sh engine.lock
